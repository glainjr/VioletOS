\* Everything at once: faults, missed beacons, two losses, a deauthentication, one access point
\* heard but out of reach and one in reach but never heard.
SPECIFICATION FairSpec
CONSTANTS
  Aps = {"a1", "a2", "a3"}
  Heard = {"a1", "a2"}
  Reach = {"a1", "a3"}
  ScanMisses = TRUE
  KeyOk = TRUE
  Faults = TRUE
  Losses = 2
  Deauths = 1
  ApTries = 4
  DhcpTries = 4
  ArpTries = 5
  DnsTries = 4
  SynTries = 3
INVARIANTS
  TypeOK StatesInOrder NoIpBeforeKeys Layered KeyNeeded FailedIsOff CodeFits OneExchange
